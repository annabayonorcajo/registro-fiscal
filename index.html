<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>ABO Fiscal Ledger | Enterprise SaaS</title>
    
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        :root {
            --bg: #000000; --sidebar: #0a0a0a; --card: #121212; --accent: #00f2ea; --accent-gold: #f59e0b;
            --safe: #10b981; --warning: #f59e0b; --risk: #ef4444; --text: #ffffff; --text-dim: #71717a; --border: #222222;
        }
        body.theme-light { --bg: #f4f4f5; --sidebar: #ffffff; --card: #ffffff; --accent: #2563eb; --safe: #059669; --risk: #e11d48; --text: #18181b; --text-dim: #52525b; --border: #e4e4e7; }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; display: flex; height: 100vh; overflow: hidden; }

        /* AUTH & LANDING (Igual que antes pero optimizado) */
        #auth-screen { position: fixed; inset: 0; z-index: 10000; overflow-y: auto; background: var(--bg); padding: 40px 20px; display: flex; align-items: center; justify-content: center; flex-direction: column;}
        .auth-card { background: var(--card); padding: 30px; border-radius: 24px; border: 1px solid var(--border); width: 100%; max-width: 400px; text-align: center; }

        /* LAYOUT APP */
        #app-layout { display: none; width: 100%; height: 100vh; overflow: hidden; }
        aside { width: 240px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 25px 15px; flex-shrink: 0; }
        .logo { font-size: 20px; font-weight: 900; margin-bottom: 25px; color: var(--accent); letter-spacing: -1px; text-align: center; }
        .nav-menu { flex: 1; overflow-y: auto; }
        .nav-btn { display: flex; align-items: center; gap: 10px; padding: 12px; color: var(--text-dim); border-radius: 10px; margin-bottom: 4px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent; width: 100%; background: none; text-align: left; position: relative;}
        .nav-btn.active { background: var(--card); color: var(--accent); border-color: var(--border); }

        main { flex: 1; overflow-y: auto; padding: 30px; scroll-behavior: smooth; }
        .section { display: none; max-width: 1000px; margin: 0 auto; animation: fade 0.2s; }
        .section.active { display: block; }

        /* SEMÁFORO COMPACTO */
        .semaforo-container { background: rgba(255,255,255,0.02); border: 1px solid var(--border); padding: 15px; border-radius: 14px; margin-bottom: 20px; }
        .semaforo-track { width: 100%; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin: 10px 0; }
        .semaforo-fill { height: 100%; background: var(--safe); width: 0%; transition: 0.5s; }

        /* CALENDARIO PEQUEÑO Y USABLE */
        .cal-header-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .cal-header-nav button { background: var(--border); color: var(--text); border: none; width: 30px; height: 30px; border-radius: 6px; cursor: pointer; }
        .month-card { background: var(--card); padding: 15px; border-radius: 14px; border: 1px solid var(--border); }
        .days-header { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin-bottom: 8px; font-size: 10px; color: var(--text-dim); }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; font-size: 13px; cursor: pointer; background: rgba(255,255,255,0.03); position: relative; }
        .day.intl { background: var(--safe) !important; color: #000 !important; font-weight: 800; }
        .day.es { background: var(--risk) !important; color: #fff !important; font-weight: 800; }
        .day.today { border: 1.5px solid var(--accent); }
        .indicator-container { display: flex; gap: 1px; margin-top: 2px; height: 4px; }
        .dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }

        /* AUDITORÍA (FIXED REFRESH) */
        .audit-table-wrapper { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
        .audit-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .audit-table th { background: #1a1a1a; padding: 12px; text-align: left; color: var(--accent); border-bottom: 1px solid var(--border); }
        .audit-table td { padding: 12px; border-bottom: 1px solid var(--border); }

        /* MODALS */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 15px; }
        .modal-box { background: var(--card); padding: 25px; border-radius: 20px; width: 100%; max-width: 450px; border: 1px solid var(--border); }
        
        .gps-btn { background: rgba(0,242,234,0.1); color: var(--accent); border: 1px solid var(--accent); padding: 12px; border-radius: 10px; width: 100%; cursor: pointer; margin-bottom: 15px; font-weight: bold; }
        .gps-btn.active { background: var(--safe); color: #000; border-color: var(--safe); }

        input, select, textarea { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
        .btn { background: var(--text); color: var(--bg); border: none; padding: 14px; border-radius: 10px; width: 100%; font-weight: 800; cursor: pointer; }

        @media (max-width: 768px) {
            #app-layout { flex-direction: column; }
            aside { position: fixed; bottom: 0; width: 100%; height: 65px; flex-direction: row; padding: 0 5px; z-index: 100; border-top: 1px solid var(--border); border-right: none; }
            .logo { display: none; }
            .nav-menu { display: flex; width: 100%; justify-content: space-around; align-items: center; }
            .nav-btn { flex-direction: column; font-size: 9px; padding: 8px; margin: 0; text-align: center; }
            main { padding: 15px 15px 80px 15px; }
        }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-card">
        <h1 style="color:var(--accent); margin-bottom:20px;">ABO Fiscal</h1>
        <div class="auth-tabs"><div class="auth-tab active" onclick="switchAuthTab('login')">Entrar</div><div class="auth-tab" onclick="switchAuthTab('register')">Registro</div></div>
        <div id="form-login" class="auth-form active">
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-pass" placeholder="Contraseña">
            <button class="btn" onclick="login()">Acceder</button>
        </div>
        <div id="form-register" class="auth-form">
            <input type="text" id="reg-name" placeholder="Nombre">
            <input type="email" id="reg-email" placeholder="Email">
            <input type="password" id="reg-pass" placeholder="Contraseña">
            <button class="btn" onclick="register()">Crear Cuenta</button>
        </div>
        <div id="auth-error" class="auth-error"></div>
    </div>
</div>

<div id="app-layout">
    <aside>
        <div class="logo">ABO <span>Fiscal</span></div>
        <nav class="nav-menu">
            <button class="nav-btn active" onclick="nav('dash')">📊 Resumen</button>
            <button class="nav-btn" onclick="nav('cal')">📅 Registro</button>
            <button class="nav-btn" onclick="nav('hash')">🔐 Auditoría</button>
            <button class="nav-btn" onclick="nav('profile')">⚙️ Ajustes</button>
        </nav>
        <button class="btn" style="font-size:10px; padding:8px;" onclick="logout()">Salir</button>
    </aside>

    <main>
        <div id="sect-dash" class="section active">
            <h2 id="dash-username">Hola...</h2>
            <div class="semaforo-container">
                <div style="display:flex; justify-content:space-between; font-size:12px;">
                    <span>Riesgo Residencia España</span>
                    <span id="semaforo-count" style="font-weight:900;">0 / 183 Días</span>
                </div>
                <div class="semaforo-track"><div class="semaforo-fill" id="semaforo-bar"></div></div>
                <p id="semaforo-text" style="font-size:11px; color:var(--text-dim);"></p>
                <div class="completeness-legend" style="margin-top:10px; border:none; background:none; padding:0;">
                    <span id="leg-img">📸: 0</span> · <span id="leg-pdf">📄: 0</span> · <span id="leg-gps">📍: 0</span>
                </div>
            </div>
            <div class="grid-stats">
                <div class="card" style="border-top:3px solid var(--safe);"><div class="label">Fuera</div><div class="val" id="st-intl">0</div></div>
                <div class="card" style="border-top:3px solid var(--risk);"><div class="label">España</div><div class="val" id="st-es">0</div></div>
            </div>
        </div>

        <div id="sect-cal" class="section">
            <div class="cal-header-nav">
                <button onclick="changeMonth(-1)">◀</button>
                <h2 id="cal-month-title">Mes Año</h2>
                <button onclick="changeMonth(1)">▶</button>
            </div>
            <div class="month-card" id="cal-render"></div>
            <button class="btn btn-outline" style="margin-top:15px; font-size:12px;" onclick="openBulkModal()">+ Registro Múltiple</button>
        </div>

        <div id="sect-hash" class="section">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h1>Historial Auditoría</h1>
                <button class="btn" style="width:auto; padding:8px 15px; font-size:12px;" onclick="exportPDF()">Exportar PDF</button>
            </div>
            <div class="audit-table-wrapper">
                <table class="audit-table">
                    <thead><tr><th>Fecha</th><th>Fichaje</th><th>País</th><th>Hash (SHA-256)</th></tr></thead>
                    <tbody id="audit-body"></tbody>
                </table>
            </div>
        </div>

        <div id="sect-profile" class="section">
            <h1>Ajustes</h1>
            <div class="card">
                <label class="label">DNI / NIF</label><input type="text" id="p-id" onchange="saveProfileConfig()">
                <label class="label">Tema</label>
                <select id="theme-sel" onchange="saveProfileConfig()"><option value="default">Oscuro</option><option value="light">Claro</option></select>
            </div>
            <button class="btn btn-gold" onclick="generateGestorLink()">Copiar Enlace Gestor</button>
        </div>
    </main>
</div>

<div id="modal-single" class="modal-overlay">
    <div class="modal-box">
        <h2 id="m-date-natural" style="color:var(--accent); margin-bottom:10px;">Fecha</h2>
        
        <button id="btn-gps" class="gps-btn" onclick="requestLocation()">📍 Obtener Ubicación Actual</button>
        <input type="hidden" id="f-gps-val">

        <label class="label">Estado</label>
        <select id="f-loc"><option value="intl">✅ Fuera de España</option><option value="es">❌ En España</option></select>
        
        <label class="label">País</label>
        <input type="text" id="f-country" list="country-list" value="Paraguay">
        
        <div class="row-2">
            <div><label class="label">Archivo</label><input type="file" id="f-file" onchange="processFile(this)"></div>
            <div><label class="label">Vuelo/Ref</label><input type="text" id="f-flight"></div>
        </div>

        <textarea id="f-notes" rows="2" placeholder="Notas..."></textarea>
        
        <button class="btn" onclick="saveDay()">Sellar Evidence</button>
        <button id="btn-delete" class="btn btn-danger" style="margin-top:10px; display:none;" onclick="deleteDay()">Eliminar</button>
        <button class="btn btn-outline" style="margin-top:10px; border:none;" onclick="closeModal('modal-single')">Cerrar</button>
    </div>
</div>

<script>
    // --- APPWRITE CONFIG ---
    const { Client, Account, ID } = Appwrite;
    const client = new Client().setEndpoint('https://sfo.cloud.appwrite.io/v1').setProject('69f8cfe400124a170d43');
    const account = new Account(client);

    let currentUser = null, db, entries = {}, currentMonth = new Date().getMonth(), currentYear = 2026, activeId = null;
    let currentFileB64 = null;

    // --- AUTH LOGIC ---
    async function checkSession() {
        try {
            currentUser = await account.get();
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-layout').style.display = 'flex';
            document.getElementById('dash-username').innerText = `Hola, ${currentUser.name.split(' ')[0]} 👋`;
            initDB(currentUser.$id);
        } catch (e) {
            document.getElementById('auth-screen').style.display = 'flex';
        }
    }

    async function login() {
        const e = document.getElementById('login-email').value, p = document.getElementById('login-pass').value;
        try { await account.createEmailPasswordSession(e, p); checkSession(); } catch (err) { alert("Error de acceso"); }
    }

    async function register() {
        const e = document.getElementById('reg-email').value, p = document.getElementById('reg-pass').value, n = document.getElementById('reg-name').value;
        try { await account.create(ID.unique(), e, p, n); await login(); } catch (err) { alert(err.message); }
    }

    function logout() { account.deleteSession('current').then(() => location.reload()); }

    // --- DATABASE ---
    function initDB(uid) {
        const req = indexedDB.open("ABO_Vault_" + uid, 1);
        req.onupgradeneeded = e => { 
            const d = e.target.result;
            d.createObjectStore("days", {keyPath: "id"}); 
            d.createObjectStore("meta", {keyPath: "id"}); 
        };
        req.onsuccess = e => { db = e.target.result; loadData(); };
    }

    function loadData() {
        const tx = db.transaction(["days", "meta"], "readonly");
        tx.objectStore("days").getAll().onsuccess = e => {
            entries = {}; e.target.result.forEach(d => entries[d.id] = d);
            renderCal(); updateStats(); syncAuditTable(); // Forzar actualización de auditoría al cargar
        };
        tx.objectStore("meta").get("profile").onsuccess = e => {
            if(e.target.result) {
                document.getElementById('p-id').value = e.target.result.nif || '';
                if(e.target.result.theme === 'light') document.body.classList.add('theme-light');
            }
        };
    }

    // --- GPS FIX ---
    function requestLocation() {
        const btn = document.getElementById('btn-gps');
        btn.innerText = "⏳ Solicitando...";
        
        if (!navigator.geolocation) {
            alert("Tu navegador no soporta GPS.");
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const coords = `${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
                document.getElementById('f-gps-val').value = coords;
                btn.innerText = "✅ Ubicación Recibida";
                btn.classList.add('active');
            },
            (err) => {
                btn.innerText = "❌ Error GPS";
                alert("Debes permitir el acceso a la ubicación en los ajustes de tu móvil/navegador.");
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    // --- CALENDAR LOGIC ---
    function changeMonth(d) {
        currentMonth += d;
        if(currentMonth > 11) { currentMonth = 0; currentYear++; }
        if(currentMonth < 0) { currentMonth = 11; currentYear--; }
        renderCal();
    }

    function renderCal() {
        const names = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
        document.getElementById('cal-month-title').innerText = `${names[currentMonth]} ${currentYear}`;
        
        const container = document.getElementById('cal-render');
        container.innerHTML = `<div class="days-header"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div><div class="days-grid"></div>`;
        const grid = container.querySelector('.days-grid');
        
        const first = (new Date(currentYear, currentMonth, 1).getDay() || 7) - 1;
        const total = new Date(currentYear, currentMonth + 1, 0).getDate();

        for(let i=0; i<first; i++) grid.innerHTML += `<div></div>`;
        
        const today = new Date();
        for(let d=1; d<=total; d++) {
            const id = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const e = entries[id];
            const isToday = (today.getDate()==d && today.getMonth()==currentMonth) ? 'today' : '';
            
            let icons = '';
            if(e) {
                if(e.photo) icons += `<span style="font-size:8px;">${e.photo.includes('pdf')?'📎':'📸'}</span>`;
                if(e.notes) icons += `<span style="font-size:8px;">📝</span>`;
            }
            
            grid.innerHTML += `<div class="day ${e?e.loc:''} ${isToday}" onclick="openDay('${id}')">${d}<div class="indicator-container">${icons}</div></div>`;
        }
    }

    // --- ACTIONS ---
    function openDay(id) {
        activeId = id;
        const e = entries[id] || {};
        document.getElementById('m-date-natural').innerText = new Date(id).toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long'});
        document.getElementById('f-loc').value = e.loc || 'intl';
        document.getElementById('f-country').value = e.country || 'Paraguay';
        document.getElementById('f-notes').value = e.notes || '';
        document.getElementById('f-gps-val').value = e.gps || '';
        document.getElementById('btn-gps').innerText = e.gps ? "✅ Ubicación Guardada" : "📍 Obtener Ubicación Actual";
        document.getElementById('btn-gps').className = e.gps ? "gps-btn active" : "gps-btn";
        document.getElementById('btn-delete').style.display = e.id ? 'block' : 'none';
        currentFileB64 = e.photo || null;
        document.getElementById('modal-single').style.display = 'flex';
    }

    async function saveDay() {
        const id = activeId;
        const loc = document.getElementById('f-loc').value;
        const country = document.getElementById('f-country').value;
        const gps = document.getElementById('f-gps-val').value;
        const notes = document.getElementById('f-notes').value;
        const ts = new Date().toLocaleString();

        const payload = `${id}${loc}${gps}${currentUser.$id}`;
        const hashBuf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(payload));
        const hash = Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');

        const entry = { id, loc, country, gps, notes, ts, photo: currentFileB64, hash, unix: Date.now() };
        
        db.transaction("days", "readwrite").objectStore("days").put(entry).onsuccess = () => {
            entries[id] = entry;
            closeModal('modal-single');
            renderCal();
            updateStats();
            syncAuditTable(); // Actualización inmediata
        };
    }

    function syncAuditTable() {
        const tbody = document.getElementById('audit-body');
        tbody.innerHTML = '';
        const sorted = Object.values(entries).sort((a,b) => b.unix - a.unix);
        sorted.forEach(e => {
            tbody.innerHTML += `<tr>
                <td><b>${e.id}</b></td>
                <td style="color:var(--text-dim)">${e.ts}</td>
                <td>${e.country}</td>
                <td class="hash-mono">${e.hash.substring(0,12)}...</td>
            </tr>`;
        });
    }

    function deleteDay() {
        if(confirm("¿Anular este registro?")) {
            db.transaction("days", "readwrite").objectStore("days").delete(activeId).onsuccess = () => {
                delete entries[activeId];
                closeModal('modal-single');
                renderCal();
                updateStats();
                syncAuditTable();
            }
        }
    }

    function processFile(input) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = e => currentFileB64 = e.target.result;
        reader.readAsDataURL(file);
    }

    function updateStats() {
        const es = Object.values(entries).filter(e => e.loc === 'es').length;
        const intl = Object.values(entries).filter(e => e.loc === 'intl').length;
        document.getElementById('st-es').innerText = es;
        document.getElementById('st-intl').innerText = intl;
        document.getElementById('semaforo-count').innerText = `${es} / 183 Días`;
        document.getElementById('semaforo-bar').style.width = Math.min((es/183)*100, 100) + '%';
        
        let g=0, p=0, i=0;
        Object.values(entries).forEach(e => {
            if(e.gps) g++;
            if(e.photo) { if(e.photo.includes('pdf')) p++; else i++; }
        });
        document.getElementById('leg-img').innerText = `📸: ${i}`;
        document.getElementById('leg-pdf').innerText = `📄: ${p}`;
        document.getElementById('leg-gps').innerText = `📍: ${g}`;
    }

    function nav(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sect-' + id).classList.add('active');
        document.querySelector(`button[onclick="nav('${id}')"]`).classList.add('active');
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function switchAuthTab(tab) {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        document.getElementById('form-login').classList.toggle('active', tab=='login');
        document.getElementById('form-register').classList.toggle('active', tab=='register');
        event.target.classList.add('active');
    }

    window.onload = checkSession;
</script>
</body>
</html>
